version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pathplanner
      POSTGRES_USER: pathplanner
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathplanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/pressly/goose:v3
    command: ["postgres", "${DATABASE_URL:-postgres://pathplanner:secret@db:5432/pathplanner?sslmode=disable}", "up"]
    volumes:
      - ./migrations:/migrations
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOOSE_DBSTRING: "${DATABASE_URL:-postgres://pathplanner:secret@db:5432/pathplanner?sslmode=disable}"
      GOOSE_DRIVER: postgres

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://pathplanner:secret@db:5432/pathplanner?sslmode=disable
      JWT_SECRET: dev-jwt-secret-change-in-prod
      SQS_QUEUE_URL: http://localstack:4566/000000000000/run-jobs
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      PORT: "8080"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      LOG_LEVEL: debug
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://pathplanner:secret@db:5432/pathplanner?sslmode=disable
      SQS_QUEUE_URL: http://localstack:4566/000000000000/run-jobs
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      WORKER_CONCURRENCY: "4"
      LOG_LEVEL: debug
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  localstack_data:
